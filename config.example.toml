# OPPO 健康云中转示例配置。复制为 config.toml 后按服务器环境修改。
[server]
host = "0.0.0.0"
port = 8000
# 只填写运行时公开地址，不要把域名写死到代码中。
public_base_url = "https://health.example.com"

[storage]
database_path = "data/health.sqlite3"
legacy_database_path = "data/cloud_cache.db"
auth_file = "auth.json"
retention_days = 365

[sync]
interval_minutes = 10
initial_history_days = 365
fallback_lookback_days = 7
min_request_interval_ms = 1000
max_metrics_per_cycle = 65

[security]
username = "admin"
# 生产环境请使用 argon2-cffi 生成的密码哈希，不要写明文密码。
password_hash = "$argon2id$v=19$m=65536,t=3,p=4$REPLACE_ME"
# OAuth issuer 应与反向代理公开地址一致，路径固定为 /mcp。
oauth_issuer_url = "https://health.example.com/mcp"
session_ttl_seconds = 43200