services:
  oppo-health-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      OPPO_HEALTH_CONFIG: /app/config.toml
      DATABASE_PATH: /app/data/health.sqlite3
      LEGACY_DATABASE_PATH: /app/data/cloud_cache.db
      OPPO_AUTH_FILE: /app/secrets/auth.json
      SECURE_COOKIES: "true"
    volumes:
      - health_data:/app/data
      - health_backups:/app/backups
      - ./config.toml:/app/config.toml:ro
      - ./secrets/auth.json:/app/secrets/auth.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  health_data:
  health_backups:
