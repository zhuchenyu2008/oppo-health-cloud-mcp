[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oppo-health-relay"
version = "0.1.0"
description = "Single-user OPPO Health cloud relay with dashboard and MCP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.30,<1.31",
  "argon2-cffi>=23,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.setuptools]
py-modules = ["cloud_mcp", "oppo_sign"]

[project.scripts]
oppo-health-backup = "oppo_health.backup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oppo_health = ["static/*"]
